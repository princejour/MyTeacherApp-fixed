name: Build Signed My Teacher Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.3.1
        run: |
          curl -L https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o gradle.zip
          unzip -q gradle.zip -d $RUNNER_TEMP/gradle
          echo "$RUNNER_TEMP/gradle/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Verify signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || (echo "Missing RELEASE_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KEY_PASSWORD" && exit 1)

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/walhero-release.jks"

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/walhero-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk MyTeacher-v1.2-code3-SIGNED.apk
          cp app/build/outputs/bundle/release/app-release.aab MyTeacher-v1.2-code3-SIGNED.aab

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: MyTeacher-v1.2-code3-SIGNED
          path: |
            MyTeacher-v1.2-code3-SIGNED.apk
            MyTeacher-v1.2-code3-SIGNED.aab
          if-no-files-found: error

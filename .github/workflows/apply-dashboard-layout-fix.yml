name: Apply Teacher Dashboard Layout Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dashboard-layout-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.3.1
        run: |
          curl -L https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Apply only the two approved layout fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          screens_path = Path('app/src/main/java/com/walhero/myteacher/TeacherScreens.kt')
          screens = screens_path.read_text(encoding='utf-8')

          horizontal_import = 'import androidx.compose.foundation.horizontalScroll\n'
          if horizontal_import not in screens:
              screens = screens.replace(
                  'import androidx.compose.foundation.layout.*\n',
                  'import androidx.compose.foundation.layout.*\n' + horizontal_import,
                  1
              )

          class_pattern = re.compile(
              r'(?P<indent>\s*)Row\(modifier = Modifier\.fillMaxWidth\(\), horizontalArrangement = Arrangement\.spacedBy\(8\.dp\)\) \{\n'
              r'(?P=indent)    classes\.forEach \{ className ->'
          )
          class_replacement = (
              r'\g<indent>Row(\n'
              r'\g<indent>    modifier = Modifier\n'
              r'\g<indent>        .fillMaxWidth()\n'
              r'\g<indent>        .horizontalScroll(rememberScrollState()),\n'
              r'\g<indent>    horizontalArrangement = Arrangement.spacedBy(8.dp)\n'
              r'\g<indent>) {\n'
              r'\g<indent>    classes.forEach { className ->'
          )
          screens, class_count = class_pattern.subn(class_replacement, screens, count=1)
          if class_count != 1:
              raise SystemExit(f'Expected exactly one classes row, found {class_count}')
          screens_path.write_text(screens, encoding='utf-8')

          delete_path = Path('app/src/main/java/com/walhero/myteacher/TeacherDashboardDeleteScreen.kt')
          delete_text = delete_path.read_text(encoding='utf-8')

          nav_import = 'import androidx.compose.foundation.layout.navigationBarsPadding\n'
          if nav_import not in delete_text:
              delete_text = delete_text.replace(
                  'import androidx.compose.foundation.layout.height\n',
                  'import androidx.compose.foundation.layout.height\n' + nav_import,
                  1
              )

          button_pattern = re.compile(
              r'\.align\(Alignment\.BottomEnd\)\n\s*\.padding\(20\.dp\)'
          )
          button_replacement = (
              '.align(Alignment.BottomEnd)\n'
              '                    .navigationBarsPadding()\n'
              '                    .padding(end = 20.dp, bottom = 12.dp)'
          )
          delete_text, button_count = button_pattern.subn(button_replacement, delete_text, count=1)
          if button_count != 1:
              raise SystemExit(f'Expected exactly one delete button modifier, found {button_count}')
          delete_path.write_text(delete_text, encoding='utf-8')
          PY

      - name: Verify only approved app files changed
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'app/src/main/java/com/walhero/myteacher/TeacherDashboardDeleteScreen.kt' \
            'app/src/main/java/com/walhero/myteacher/TeacherScreens.kt' | sort)"
          test "$changed" = "$expected" || {
            echo 'Unexpected changed files:'
            printf '%s\n' "$changed"
            exit 1
          }

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/walhero/myteacher/TeacherScreens.kt \
                  app/src/main/java/com/walhero/myteacher/TeacherDashboardDeleteScreen.kt
          git commit -m "Fix only approved teacher dashboard layout issues"
          git push

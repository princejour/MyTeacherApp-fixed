name: Build Correct My Teacher AdMob Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout correct repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.3.1
        run: |
          curl -L https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o gradle.zip
          unzip -q gradle.zip -d $RUNNER_TEMP/gradle
          echo "$RUNNER_TEMP/gradle/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare clearly named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MyTeacher-CORRECT-Icon-History-AdMob-Test.apk

      - name: Upload correct APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTeacher-CORRECT-Icon-History-AdMob-Test
          path: MyTeacher-CORRECT-Icon-History-AdMob-Test.apk
          if-no-files-found: error
